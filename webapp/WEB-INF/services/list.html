<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Service Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<!-- Header Fragment -->
<div th:insert="~{fragments/header :: header}"></div>

<div class="container mt-4">
    <div class="row">
        <div class="col-md-12">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2>Service Management</h2>
                <a th:href="@{/services/add}" class="btn btn-success">
                    <i class="bi bi-plus-circle"></i> Add New Service
                </a>
            </div>

            <!-- Notification area -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Service Table -->
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Code</th>
                        <th>Service Name</th>
                        <th>Unit Price</th>
                        <th>Unit</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th class="text-center">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="service : ${services}">
                        <td th:text="${service.hotelServiceId}">1</td>
                        <td><strong th:text="${service.serviceCode}">LAUNDRY</strong></td>
                        <td th:text="${service.serviceName}">Giặt ủi đồ</td>
                        <td th:text="${#numbers.formatDecimal(service.unitPrice, 0, 'COMMA', 0, 'POINT') + ' VNĐ'}">50,000 VNĐ</td>
                        <td th:text="${service.unitName != null ? service.unitName : '-'}">Kg</td>
                        <td th:text="${service.description != null ? service.description : '-'}">Giặt sấy lấy ngay</td>
                        <td>
                            <span th:if="${service.active}" class="badge bg-success">Active</span>
                            <span th:unless="${service.active}" class="badge bg-secondary">Inactive</span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/services/edit/{id}(id=${service.hotelServiceId})}"
                               class="btn btn-sm btn-warning me-1">Edit</a>

                            <button class="btn btn-sm btn-danger"
                                    th:onclick="deleteService([[${service.hotelServiceId}]], [[${#httpServletRequest.contextPath}]])">
                                Delete
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(services)}">
                        <td colspan="8" class="text-center text-muted py-4">No services found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Footer Fragment -->
<div th:insert="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function deleteService(serviceId, contextPath) {
        if (confirm('Are you sure you want to delete this service?')) {
            const url = (contextPath ? contextPath : '') + '/services/delete/' + serviceId;

            fetch(url, { method: 'DELETE' })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        location.reload();
                    } else {
                        alert('Error: ' + (data.error || 'Failed to delete service'));
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An unexpected error occurred.');
                });
        }
    }
</script>
</body>
</html>
