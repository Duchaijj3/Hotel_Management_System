<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add New Service</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<!-- Header Fragment -->
<div th:insert="~{fragments/header :: header}"></div>

<div class="container mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">Add New Service</h4>
                </div>
                <div class="card-body">

                    <!-- Form Action dùng Thymeleaf URL expression -->
                    <form method="POST" th:action="@{/services/add}">

                        <!-- Service Code -->
                        <div class="mb-3">
                            <label for="serviceCode" class="form-label font-weight-bold">Service Code <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="serviceCode" name="serviceCode"
                                   placeholder="E.g., LAUNDRY, MINIBAR_BEER"
                                   style="text-transform: uppercase;" required>
                            <div class="form-text">Unique identifier for the service.</div>
                        </div>

                        <!-- Service Name -->
                        <div class="mb-3">
                            <label for="serviceName" class="form-label">Service Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="serviceName" name="serviceName"
                                   placeholder="E.g., Laundry Service, Tiger Beer" required>
                        </div>

                        <!-- Unit Price -->
                        <div class="mb-3">
                            <label for="unitPrice" class="form-label">Unit Price (VNĐ) <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="unitPrice" name="unitPrice"
                                   step="1000" min="0" placeholder="E.g., 50000" required>
                        </div>

                        <!-- Unit Name -->
                        <div class="mb-3">
                            <label for="unitName" class="form-label">Unit Name</label>
                            <input type="text" class="form-control" id="unitName" name="unitName"
                                   placeholder="E.g., Kg, Bottle, Hour, Item">
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3"
                                      placeholder="Enter brief description about the service..."></textarea>
                        </div>

                        <!-- Form Action Buttons -->
                        <div class="d-flex justify-content-between pt-2">
                            <a th:href="@{/services/list}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-success px-4">
                                <i class="bi bi-check-circle"></i> Add Service
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer Fragment -->
<div th:insert="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
